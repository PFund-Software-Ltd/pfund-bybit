# TEMP: replaced by afterpython's release workflow once `ap init` is run
name: Release to PyPI

on:
  push:
    tags:
      - 'v*'  # e.g. v0.0.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Check tag matches version
        run: |
          VERSION="$(uv version --short)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION in pyproject.toml"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import pfund_bybit.rest_api, pfund_bybit.ws_api, pfund_bybit.parser, pfund_bybit.adapter; from pfund_bybit import Bybit"

      - name: Publish to PyPI
        # Skip files already on PyPI so a re-run doesn't fail here
        run: uv publish --check-url https://pypi.org/simple/
